# Nightly "operate" agent: finds docs/dependency drift and opens at most one issue.
name: Nightly drift check
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Check this repo for drift:
            1. Commands in README.md and CLAUDE.md that no longer exist in package.json scripts.
            2. `npm outdated` results with a major version behind.
            3. Files referenced in docs/ that no longer exist.
            First run `gh issue list --label drift --state open`. If an open drift issue exists, add a comment
            only if something new was found. Otherwise, if drift was found, open ONE issue labeled `drift`
            with a checklist. If nothing drifted, do nothing.
          claude_args: >-
            --max-turns 15
            --model haiku
            --allowedTools "Read,Grep,Glob,Bash(npm outdated:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*)"
