name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# `shell: bash` runs every step with -eo pipefail. Without it, `cmd | tee` takes tee's exit code, so a failing
# gate passes (test/workflow-shell.test.ts enforces this for every workflow with run steps).
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
