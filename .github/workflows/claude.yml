# Stages 2-3-5: a line starting with "@claude" on an open READY issue → plan (from context/), fix test-first, open an honest PR
# assigned to a human. On a PR, "@claude" addresses review feedback. Agents never merge or release.
name: "2-3 · Plan and fix (@claude)"
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  gate:
    # Decides whether @claude runs, in this order:
    #   1. Is the comment a call to @claude (a line starting with it, on an open issue or PR)?
    #   2. Input scan of everything @claude would read (scripts/scan-untrusted.ts), so a flag in the
    #      triggering comment itself counts. The labels are read live, not from the event payload.
    #   3. Flagged by the scan: label the thread and post the report. Flagged live (by the intake agent) or issue
    #      not `ready`: explain the real reason. Claude runs only when nothing is flagged and the issue is `ready`.
    if: |
      contains(github.event.comment.body, '@claude')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
      KIND: ${{ (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) && 'pr' || 'issue' }}
      NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # invocation: a call is a line that starts with @claude (any case, up to 3 spaces of indent) followed by a
      # space, comma, colon or the end of the line. Code blocks (fenced or indented 4+ spaces), HTML comments,
      # quoted replies ("> @claude"), possessives ("@claude's") and comments on closed issues or PRs do not count.
      # Tested by test/claude-gate-reply.test.ts.
      - id: invoke
        run: |
          if [ "${STATE:-}" = "closed" ]; then echo "invoked=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          visible="$(printf '%s' "${BODY:-}" | perl -0777 -pe 's/\r//g; s/<!--.*?(?:-->|\z)//gs; s/^ {0,3}(`{3,}|~{3,})[^\n]*\n.*?(?:^ {0,3}\1[^\n]*$|\z)//gms')"
          if grep -qiE '^ {0,3}@claude([[:space:],:]|$)' <<<"$visible"; then
            echo "invoked=true" >> "$GITHUB_OUTPUT"
          else
            echo "invoked=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          BODY: ${{ github.event.comment.body }}
          STATE: ${{ github.event.issue.state || github.event.pull_request.state }}
      - if: steps.invoke.outputs.invoked == 'true'
        uses: actions/checkout@v7
      - if: steps.invoke.outputs.invoked == 'true'
        uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - if: steps.invoke.outputs.invoked == 'true'
        run: npm ci
      - id: scan
        if: steps.invoke.outputs.invoked == 'true'
        run: npx tsx scripts/scan-untrusted.ts "$KIND" "$NUM"
        env:
          # The triggering comment, in case the API read above does not include it yet.
          EXTRA_TEXT: ${{ github.event.comment.body }}
      # live-labels: tested by test/claude-gate-reply.test.ts.
      - name: Read labels live and add what the scan just found
        id: labels
        if: steps.invoke.outputs.invoked == 'true'
        run: |
          json="$(gh "$KIND" view "$NUM" --json labels --jq '[.labels[].name]')"
          if [ "$BLOCKED" = "true" ]; then json="$(jq -c '. + ["prompt-injection"] | unique' <<<"$json")"; fi
          if [ "$SECRET" = "true" ]; then json="$(jq -c '. + ["security"] | unique' <<<"$json")"; fi
          echo "json=$(jq -c . <<<"$json")" >> "$GITHUB_OUTPUT"
          echo "ready=$(jq -r 'map(ascii_downcase) | index("ready") != null' <<<"$json")" >> "$GITHUB_OUTPUT"
          # A live flag blocks too (the intake agent can flag what the patterns miss), unless a maintainer cleared it.
          echo "flagged=$(jq -r 'map(ascii_downcase) | index("prompt-injection") != null and index("scan-cleared") == null' <<<"$json")" >> "$GITHUB_OUTPUT"
        env:
          BLOCKED: ${{ steps.scan.outputs.blocked }}
          SECRET: ${{ steps.scan.outputs.secret }}
      - name: Scan blocked it - label the thread and post the report
        if: steps.scan.outputs.blocked == 'true'
        run: |
          add="prompt-injection"
          if [ "$SECRET" = "true" ]; then add="$add,security"; fi
          gh "$KIND" edit "$NUM" --add-label "$add" --remove-label ready
          {
            echo "@claude did not run."
            echo
            cat runs/scan-report.md
            if [ "$KIND" = "issue" ]; then
              echo
              echo "Once the flag is cleared, intake checks the issue again and adds \`ready\` if it is complete. Then mention @claude again."
            fi
          } > runs/claude-blocked.md
          gh "$KIND" comment "$NUM" --body-file runs/claude-blocked.md
        env:
          SECRET: ${{ steps.scan.outputs.secret }}
      - name: Flagged PR - explain
        if: env.KIND == 'pr' && steps.scan.outputs.blocked == 'false' && steps.labels.outputs.flagged == 'true'
        run: |
          gh pr comment "$NUM" --body "@claude did not run: this PR is labeled \`prompt-injection\`. A maintainer reviews the text and adds \`scan-cleared\` if it is safe, then mentions @claude again."
      # gate-reply: tell the reporter the real reason @claude did not run and how to resume.
      # Clearing a flag makes intake check readiness again (intake.yml), so nobody adds `ready` by hand.
      # Tested by test/claude-gate-reply.test.ts, which runs this script against a stub `gh`.
      - name: Explain why @claude did not run on this issue
        if: env.KIND == 'issue' && steps.scan.outputs.blocked == 'false' && (steps.labels.outputs.ready == 'false' || steps.labels.outputs.flagged == 'true')
        run: |
          resume="Once the flag is cleared, intake checks the issue again and adds \`ready\` if it is complete. Then mention @claude again."
          # Fail loudly rather than fall back to the wrong reply if the labels did not arrive as a JSON array.
          jq -s -e 'length == 1 and (.[0] | type == "array" and all(.[]; type == "string"))' <<<"${LABELS:-}" >/dev/null \
            || { echo "::error::LABELS is not a JSON array of strings"; exit 1; }
          # Case-insensitive, like GitHub's own label matching.
          has() { jq -e --arg l "$1" 'map(ascii_downcase) | index($l) != null' <<<"$LABELS" >/dev/null; }
          # `security` is ambiguous: the scan adds it for a pasted secret, the intake agent for a vulnerability report.
          secret_note="If a secret was posted, rotate it now and delete the text: \`scan-cleared\` does not override a secret."
          if has prompt-injection && has security; then
            msg="@claude did not run: text in this thread was flagged, and the issue is marked \`security\`. $secret_note Otherwise edit the flagged text"
            if has scan-cleared; then msg="$msg."; else msg="$msg, or a maintainer adds \`scan-cleared\` if it is a false positive."; fi
            msg="$msg $resume"
          elif has prompt-injection && has scan-cleared; then
            msg="@claude did not run: the flag on this thread was cleared, and intake is checking the issue again. Once it adds \`ready\`, mention @claude again. If intake asks for details, add them first."
          elif has prompt-injection; then
            msg="@claude did not run: text in this thread was flagged as possible prompt injection. Edit the flagged text, or a maintainer adds \`scan-cleared\` if it is a false positive. $resume"
          elif has security; then
            msg="@claude did not run: this issue is marked \`security\`. If a secret was posted here, rotate it even if the text was deleted. Vulnerabilities belong in a private report (Security, then Report a vulnerability), not a public issue. If it is safe to work on in public, a maintainer adds \`ready\` and mentions @claude again."
          else
            msg="Intake gate: this issue is not labeled \`ready\` yet. Add the missing details the intake comment asked for (or a maintainer adds \`ready\`), then mention @claude again."
          fi
          gh issue comment "$NUM" -R "$REPO" --body "$msg"
        env:
          REPO: ${{ github.repository }}
          LABELS: ${{ steps.labels.outputs.json }}
      # decide: Claude runs only when invoked, the scan is clean, nothing is flagged live, and it is a PR or a
      # `ready` issue. Any missing value (a failed step) means no. Tested by test/claude-gate-reply.test.ts.
      - id: decide
        if: always()
        run: |
          run=false
          if [ "$INVOKED" = "true" ] && [ "$BLOCKED" = "false" ] && [ "$FLAGGED" = "false" ] \
             && { [ "$KIND" = "pr" ] || [ "$READY" = "true" ]; }; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
        env:
          INVOKED: ${{ steps.invoke.outputs.invoked }}
          BLOCKED: ${{ steps.scan.outputs.blocked }}
          FLAGGED: ${{ steps.labels.outputs.flagged }}
          READY: ${{ steps.labels.outputs.ready }}
      - name: The gate itself failed - say so instead of staying silent
        if: failure() && steps.invoke.outputs.invoked == 'true'
        run: |
          gh "$KIND" comment "$NUM" --body "@claude did not run: the gate check failed before it could decide. A maintainer can look at the run: $RUN_URL"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  claude:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The pipeline itself (plan from context/, red test first, honest PR) is defined in CLAUDE.md.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm test:*),Bash(npm run typecheck),Bash(npm run test:property),Bash(npx vitest run:*),Bash(npx tsx scripts/risk-tier.ts:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(gh pr create:*),Bash(gh issue view:*)"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: audit-log, path: runs/, if-no-files-found: ignore }
