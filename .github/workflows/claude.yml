# Stages 2-3-5: "@claude" on a READY issue → plan (from context/), fix test-first, open an honest PR
# assigned to a human. On a PR, "@claude" addresses review feedback. Agents never merge or release.
name: "2-3 · Plan and fix (@claude)"
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  gate:
    # @claude on an issue that has not passed intake: explain instead of running.
    if: |
      github.event_name == 'issue_comment'
      && !github.event.issue.pull_request
      && contains(github.event.comment.body, '@claude')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && !contains(github.event.issue.labels.*.name, 'ready')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # A flagged issue is not ready because the input scan paused it, not because details are missing.
      - run: |
          if [ "$FLAGGED" = "true" ]; then
            msg="@claude did not run: the input scan flagged text in this thread (see the scan report above). Edit the flagged text, or a maintainer adds \`scan-cleared\` if it is a false positive."
          else
            msg="Intake gate: this issue is not labeled \`ready\` yet. Add the missing details the intake comment asked for (or a maintainer adds \`ready\`), then mention @claude again."
          fi
          gh issue comment "$NUM" -R "$REPO" --body "$msg"
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          FLAGGED: ${{ contains(github.event.issue.labels.*.name, 'prompt-injection') }}

  scan:
    # Input scan of everything @claude would read: title, body, comments, reviews (scripts/scan-untrusted.ts).
    if: |
      contains(github.event.comment.body, '@claude')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      && (github.event_name == 'pull_request_review_comment'
          || github.event.issue.pull_request
          || contains(github.event.issue.labels.*.name, 'ready'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      blocked: ${{ steps.scan.outputs.blocked }}
    env:
      GH_TOKEN: ${{ github.token }}
      KIND: ${{ (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) && 'pr' || 'issue' }}
      NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: scan
        run: npx tsx scripts/scan-untrusted.ts "$KIND" "$NUM"
      - name: Explain why @claude did not run
        if: steps.scan.outputs.blocked == 'true'
        run: |
          gh "$KIND" edit "$NUM" --add-label prompt-injection
          { echo "@claude did not run."; echo; cat runs/scan-report.md; } > runs/claude-blocked.md
          gh "$KIND" comment "$NUM" --body-file runs/claude-blocked.md

  claude:
    needs: scan
    if: needs.scan.outputs.blocked == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The pipeline itself (plan from context/, red test first, honest PR) is defined in CLAUDE.md.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm test:*),Bash(npm run typecheck),Bash(npm run test:property),Bash(npx vitest run:*),Bash(npx tsx scripts/risk-tier.ts:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(gh pr create:*),Bash(gh issue view:*)"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: audit-log, path: runs/, if-no-files-found: ignore }
